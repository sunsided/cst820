[package]
name = "cst820-wokwi-chip"
description = "Wokwi custom chip wrapping the cst820-sim behavioral model"
version = "0.1.0"
license = "EUPL-1.2 OR MIT OR Apache-2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cst820-registers = { path = "../../cst820-registers" }
cst820-sim = { path = "../../cst820-sim" }
wokwi_chip_ll = "0.2.0"

[profile.release]
opt-level = "s"
lto = true
