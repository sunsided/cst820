[package]
name = "cst820"
description = "A platform-agnostic embedded-hal driver for the Hynitron CST820 touch controller"
categories = ["embedded", "hardware-support", "no-std"]
keywords = ["embedded-hal-driver", "cst820", "touch", "touchscreen", "i2c"]
readme = "README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt", "cst820-registers/defmt"]

[dependencies]
cst820-registers.workspace = true
defmt = { workspace = true, optional = true }
embedded-hal.workspace = true
embedded-hal-async = { workspace = true, optional = true }

[dev-dependencies]
cst820-sim.workspace = true
embassy-futures.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/cst820/releases/tag/v{{version}}", exactly = 1 },
]
